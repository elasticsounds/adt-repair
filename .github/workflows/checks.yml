name: Release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r plugins/adt-repair/requirements.txt
      - name: Install browser dependencies
        working-directory: plugins/adt-repair
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test helpers and report output
        run: python -m unittest discover -s tests -v
      - name: Test browser capture helper
        run: node tests/browser-smoke.mjs
      - name: Validate and build release archives
        run: python scripts/build_release.py
